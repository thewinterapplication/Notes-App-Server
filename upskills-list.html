<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uploaded Upskills</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-soft: rgba(30, 41, 59, 0.45);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .header-copy {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            width: fit-content;
        }

        .back-link:hover {
            color: var(--primary);
        }

        h1 {
            margin: 0;
            font-size: 1.75rem;
            font-weight: 600;
        }

        .subtitle {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .header-links {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .header-link {
            text-decoration: none;
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.35);
            background-color: rgba(99, 102, 241, 0.08);
            padding: 0.7rem 0.95rem;
            border-radius: 0.7rem;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .header-link:hover {
            background-color: rgba(99, 102, 241, 0.16);
            border-color: var(--primary);
            color: var(--text);
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.25rem;
        }

        .summary {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .summary-count {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .summary-hint {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .secondary-btn {
            border: 1px solid var(--border);
            background-color: transparent;
            color: var(--text);
            border-radius: 0.7rem;
            padding: 0.75rem 0.95rem;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .secondary-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .status {
            display: none;
            margin-bottom: 1rem;
            padding: 0.9rem 1rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border);
            color: var(--text-muted);
            background-color: rgba(15, 23, 42, 0.45);
        }

        .status.error {
            display: block;
            color: #fecaca;
            border-color: rgba(239, 68, 68, 0.35);
            background-color: rgba(127, 29, 29, 0.2);
        }

        .items-list {
            display: grid;
            gap: 1rem;
        }

        .item-card {
            display: grid;
            grid-template-columns: minmax(180px, 220px) 1fr;
            gap: 1rem;
            padding: 1rem;
            border: 1px solid var(--border);
            background-color: rgba(15, 23, 42, 0.35);
            border-radius: 1rem;
        }

        .item-image-wrap {
            border-radius: 0.85rem;
            overflow: hidden;
            border: 1px solid rgba(51, 65, 85, 0.7);
            background-color: rgba(15, 23, 42, 0.55);
            min-height: 180px;
        }

        .item-image {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-body {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            min-width: 0;
        }

        .item-title {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 600;
            word-break: break-word;
        }

        .item-subtitle {
            margin: 0.3rem 0 0 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 0.8rem;
        }

        .meta-item {
            background-color: var(--surface-soft);
            border: 1px solid rgba(51, 65, 85, 0.7);
            border-radius: 0.8rem;
            padding: 0.75rem 0.85rem;
        }

        .meta-label {
            display: block;
            margin-bottom: 0.35rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .meta-value {
            font-size: 0.92rem;
            word-break: break-word;
        }

        .card-actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            padding-top: 0.2rem;
        }

        .action-link {
            text-decoration: none;
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.35);
            background-color: rgba(99, 102, 241, 0.08);
            padding: 0.75rem 0.95rem;
            border-radius: 0.75rem;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .action-link:hover {
            background-color: rgba(99, 102, 241, 0.16);
            border-color: var(--primary);
            color: var(--text);
        }

        .empty-state {
            display: none;
            text-align: center;
            padding: 2.75rem 1rem;
            border: 1px dashed var(--border);
            border-radius: 1rem;
            color: var(--text-muted);
        }

        @media (max-width: 720px) {
            body {
                padding: 1rem 0.75rem;
            }

            .container {
                padding: 1.25rem;
            }

            .item-card {
                grid-template-columns: 1fr;
            }

            .item-image-wrap {
                min-height: 220px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-copy">
                <a href="/upload" class="back-link">&larr; Back to upload</a>
                <h1>Uploaded Upskills</h1>
                <p class="subtitle">Review every uploaded upskill card from one place.</p>
            </div>

            <div class="header-links">
                <a href="/upload/upskills" class="header-link">Upload Upskill</a>
                <a href="/jobs" class="header-link">View Jobs</a>
            </div>
        </div>

        <div class="toolbar">
            <div class="summary">
                <div class="summary-count" id="summary-count">Loading upskills...</div>
                <div class="summary-hint">Upskills are sorted by newest first.</div>
            </div>
            <button type="button" id="refresh-btn" class="secondary-btn">Refresh</button>
        </div>

        <div id="status-message" class="status"></div>
        <div id="items-list" class="items-list"></div>
        <div id="empty-state" class="empty-state">No upskills uploaded yet.</div>
    </div>

    <script>
        const refreshBtn = document.getElementById('refresh-btn');
        const summaryCount = document.getElementById('summary-count');
        const statusMessage = document.getElementById('status-message');
        const itemsList = document.getElementById('items-list');
        const emptyState = document.getElementById('empty-state');

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text ?? '';
            return div.innerHTML;
        }

        function formatDate(value) {
            const date = new Date(value);

            if (Number.isNaN(date.getTime())) {
                return 'Unknown';
            }

            return date.toLocaleString();
        }

        function setStatus(message = '', isError = false) {
            statusMessage.textContent = message;
            statusMessage.className = isError ? 'status error' : 'status';
            statusMessage.style.display = message ? 'block' : 'none';
        }

        async function parseJson(response) {
            try {
                return await response.json();
            } catch {
                return {};
            }
        }

        function renderUpskills(upskills) {
            itemsList.innerHTML = '';
            summaryCount.textContent = `${upskills.length} upskill${upskills.length !== 1 ? 's' : ''}`;

            if (upskills.length === 0) {
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            upskills.forEach((upskill) => {
                const card = document.createElement('article');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="item-image-wrap">
                        <img class="item-image" src="${escapeHtml(upskill.imageUrl)}" alt="${escapeHtml(upskill.upskillName || 'Upskill image')}">
                    </div>

                    <div class="item-body">
                        <div>
                            <h2 class="item-title">${escapeHtml(upskill.upskillName || 'Untitled upskill')}</h2>
                            <p class="item-subtitle">Uploaded ${escapeHtml(formatDate(upskill.createdAt))}</p>
                        </div>

                        <div class="meta-grid">
                            <div class="meta-item">
                                <span class="meta-label">Upskill Name</span>
                                <div class="meta-value">${escapeHtml(upskill.upskillName || 'Untitled upskill')}</div>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">Upskill URL</span>
                                <div class="meta-value">${escapeHtml(upskill.upskillUrl || 'Missing')}</div>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">Image URL</span>
                                <div class="meta-value">${escapeHtml(upskill.imageUrl || 'Missing')}</div>
                            </div>
                        </div>

                        <div class="card-actions">
                            <a class="action-link" href="${escapeHtml(upskill.upskillUrl)}" target="_blank" rel="noopener noreferrer">Open Upskill URL</a>
                            <a class="action-link" href="${escapeHtml(upskill.imageUrl)}" target="_blank" rel="noopener noreferrer">Open Image</a>
                        </div>
                    </div>
                `;

                itemsList.appendChild(card);
            });
        }

        async function loadUpskills() {
            setStatus('');
            summaryCount.textContent = 'Loading upskills...';
            emptyState.style.display = 'none';
            itemsList.innerHTML = '';

            try {
                const response = await fetch('/api/upskills');
                const data = await parseJson(response);

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to load upskills');
                }

                renderUpskills(Array.isArray(data.upskills) ? data.upskills : []);
            } catch (error) {
                renderUpskills([]);
                setStatus(error.message || 'Failed to load upskills', true);
            }
        }

        refreshBtn.addEventListener('click', loadUpskills);

        loadUpskills();
    </script>
</body>

</html>
