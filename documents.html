<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uploaded Documents</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-soft: rgba(30, 41, 59, 0.45);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --warning: #eab308;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1120px;
            margin: 0 auto;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .header-copy {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            width: fit-content;
        }

        .back-link:hover {
            color: var(--primary);
        }

        h1 {
            margin: 0;
            font-size: 1.75rem;
            font-weight: 600;
        }

        .subtitle {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .header-links {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .header-link {
            text-decoration: none;
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.35);
            background-color: rgba(99, 102, 241, 0.08);
            padding: 0.7rem 0.95rem;
            border-radius: 0.7rem;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .header-link:hover {
            background-color: rgba(99, 102, 241, 0.16);
            border-color: var(--primary);
            color: var(--text);
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 0.85rem;
            margin-bottom: 1.25rem;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }

        .filter-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .input-field {
            width: 100%;
            padding: 0.8rem 0.9rem;
            background-color: var(--surface-soft);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            color: var(--text);
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .input-field:focus {
            border-color: var(--primary);
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.25rem;
        }

        .summary {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .summary-count {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .summary-hint {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .toolbar-actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .secondary-btn {
            border: 1px solid var(--border);
            background-color: transparent;
            color: var(--text);
            border-radius: 0.7rem;
            padding: 0.75rem 0.95rem;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .secondary-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .status {
            display: none;
            margin-bottom: 1rem;
            padding: 0.9rem 1rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border);
            color: var(--text-muted);
            background-color: rgba(15, 23, 42, 0.45);
        }

        .status.error {
            display: block;
            color: #fecaca;
            border-color: rgba(239, 68, 68, 0.35);
            background-color: rgba(127, 29, 29, 0.2);
        }

        .documents-list {
            display: grid;
            gap: 1rem;
        }

        .document-card {
            border: 1px solid var(--border);
            background-color: rgba(15, 23, 42, 0.35);
            border-radius: 1rem;
            padding: 1.1rem;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .doc-title-wrap {
            min-width: 0;
        }

        .doc-title {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 600;
            word-break: break-word;
        }

        .doc-subtitle {
            margin: 0.35rem 0 0 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 88px;
            padding: 0.45rem 0.7rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: capitalize;
            border: 1px solid transparent;
        }

        .badge.free {
            background-color: rgba(16, 185, 129, 0.12);
            border-color: rgba(16, 185, 129, 0.28);
            color: var(--success);
        }

        .badge.premium {
            background-color: rgba(234, 179, 8, 0.12);
            border-color: rgba(234, 179, 8, 0.28);
            color: var(--warning);
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0.8rem;
        }

        .meta-item {
            background-color: var(--surface-soft);
            border: 1px solid rgba(51, 65, 85, 0.7);
            border-radius: 0.8rem;
            padding: 0.75rem 0.85rem;
        }

        .meta-label {
            display: block;
            margin-bottom: 0.35rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .meta-value {
            font-size: 0.92rem;
            word-break: break-word;
        }

        .card-actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(51, 65, 85, 0.7);
        }

        .delete-btn {
            border-radius: 0.75rem;
            padding: 0.8rem 1rem;
            font-family: inherit;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .delete-btn {
            border: 1px solid rgba(239, 68, 68, 0.3);
            background-color: rgba(239, 68, 68, 0.08);
            color: #fca5a5;
        }

        .delete-btn:hover:not(:disabled) {
            background-color: rgba(239, 68, 68, 0.18);
            border-color: var(--danger);
            color: #fee2e2;
        }

        .delete-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .empty-state {
            display: none;
            text-align: center;
            padding: 2.75rem 1rem;
            border: 1px dashed var(--border);
            border-radius: 1rem;
            color: var(--text-muted);
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem 0.75rem;
            }

            .container {
                padding: 1.25rem;
            }

            .card-top {
                flex-direction: column;
            }

            .badge {
                min-width: 0;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-copy">
                <a href="/upload" class="back-link" id="back-link">&larr; Back to upload</a>
                <h1 id="page-title">Uploaded Documents</h1>
                <p class="subtitle" id="page-subtitle">Filter, review, and delete uploaded notes PDFs.</p>
            </div>

            <div class="header-links">
                <a href="/upload" class="header-link" id="upload-more-link">Upload More</a>
                <a href="/mappings" class="header-link" id="manage-mappings-link">Manage Mappings</a>
            </div>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label class="filter-label" for="search-input">Search</label>
                <input id="search-input" class="input-field" type="text"
                    placeholder="File name, author, course, subject">
            </div>

            <div class="filter-group">
                <label class="filter-label" for="course-filter">Course</label>
                <select id="course-filter" class="input-field">
                    <option value="">All Courses</option>
                </select>
            </div>

            <div class="filter-group">
                <label class="filter-label" for="subject-filter">Subject</label>
                <select id="subject-filter" class="input-field">
                    <option value="">All Subjects</option>
                </select>
            </div>

            <div class="filter-group">
                <label class="filter-label" for="access-filter">Access Type</label>
                <select id="access-filter" class="input-field">
                    <option value="">All Access Types</option>
                    <option value="free">Free</option>
                    <option value="premium">Premium</option>
                </select>
            </div>
        </div>

        <div class="toolbar">
            <div class="summary">
                <div class="summary-count" id="summary-count">Loading documents...</div>
                <div class="summary-hint" id="summary-hint">Filters update instantly.</div>
            </div>

            <div class="toolbar-actions">
                <button type="button" id="clear-filters-btn" class="secondary-btn">Clear Filters</button>
                <button type="button" id="refresh-btn" class="secondary-btn">Refresh</button>
            </div>
        </div>

        <div id="status-message" class="status"></div>
        <div id="documents-list" class="documents-list"></div>
        <div id="empty-state" class="empty-state">No documents match the current filters.</div>
    </div>

    <script>
        const routePath = window.location.pathname.replace(/\/+$/, '') || '/documents';
        const pageConfig = routePath === '/placements'
            ? {
                title: 'Uploaded Placements',
                subtitle: 'Filter, review, and delete uploaded placement PDFs.',
                backHref: '/upload-placement',
                uploadHref: '/upload-placement',
                apiUrl: '/api/placements/documents',
                itemLabel: 'placement',
                itemLabelPlural: 'placements',
                loadingSummary: 'Loading placements...',
                loadingHint: 'Fetching the latest uploaded placements.',
                deleteLabel: 'Delete Placement',
                emptyState: 'No placements match the current filters.',
                deleteStorageError: 'Placement entry deleted, but the stored file could not be removed completely.',
                loadError: 'Failed to load placements',
                mappingsApiUrl: '/api/placement-mappings',
                mappingsPageHref: '/placement-mappings',
                mappingsPageLabel: 'Manage Placement Mappings',
                mappingsLoadError: 'Failed to load placement mappings',
            }
            : routePath === '/jntu'
            ? {
                title: 'Uploaded JNTU Syllabus',
                subtitle: 'Filter, review, and delete uploaded JNTU syllabus PDFs.',
                backHref: '/upload-jntu',
                uploadHref: '/upload-jntu',
                apiUrl: '/api/jntu/documents',
                itemLabel: 'JNTU file',
                itemLabelPlural: 'JNTU files',
                loadingSummary: 'Loading JNTU files...',
                loadingHint: 'Fetching the latest uploaded JNTU syllabus files.',
                deleteLabel: 'Delete JNTU File',
                emptyState: 'No JNTU files match the current filters.',
                deleteStorageError: 'JNTU entry deleted, but the stored file could not be removed completely.',
                loadError: 'Failed to load JNTU files',
                mappingsApiUrl: '/api/jntu-mappings',
                mappingsPageHref: '/jntu-mappings',
                mappingsPageLabel: 'Manage JNTU Mappings',
                mappingsLoadError: 'Failed to load JNTU mappings',
            }
            : {
                title: 'Uploaded Documents',
                subtitle: 'Filter, review, and delete uploaded notes PDFs.',
                backHref: '/upload',
                uploadHref: '/upload',
                apiUrl: '/api/documents',
                itemLabel: 'document',
                itemLabelPlural: 'documents',
                loadingSummary: 'Loading documents...',
                loadingHint: 'Fetching the latest uploaded notes.',
                deleteLabel: 'Delete Document',
                emptyState: 'No documents match the current filters.',
                deleteStorageError: 'Document entry deleted, but the stored file could not be removed completely.',
                loadError: 'Failed to load documents',
                mappingsApiUrl: '/api/mappings',
                mappingsPageHref: '/mappings',
                mappingsPageLabel: 'Manage Mappings',
                mappingsLoadError: 'Failed to load course mappings',
            };

        document.title = pageConfig.title;
        document.getElementById('page-title').textContent = pageConfig.title;
        document.getElementById('page-subtitle').textContent = pageConfig.subtitle;
        document.getElementById('back-link').href = pageConfig.backHref;
        document.getElementById('upload-more-link').href = pageConfig.uploadHref;
        document.getElementById('manage-mappings-link').href = pageConfig.mappingsPageHref;
        document.getElementById('manage-mappings-link').textContent = pageConfig.mappingsPageLabel;
        document.getElementById('empty-state').textContent = pageConfig.emptyState;

        const searchInput = document.getElementById('search-input');
        const courseFilter = document.getElementById('course-filter');
        const subjectFilter = document.getElementById('subject-filter');
        const accessFilter = document.getElementById('access-filter');
        const clearFiltersBtn = document.getElementById('clear-filters-btn');
        const refreshBtn = document.getElementById('refresh-btn');
        const summaryCount = document.getElementById('summary-count');
        const summaryHint = document.getElementById('summary-hint');
        const statusMessage = document.getElementById('status-message');
        const documentsList = document.getElementById('documents-list');
        const emptyState = document.getElementById('empty-state');

        let allDocuments = [];
        let allMappings = [];

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text ?? '';
            return div.innerHTML;
        }

        function normalizeValue(value, fallback = 'uncategorized') {
            const trimmedValue = (value || '').trim();
            return trimmedValue || fallback;
        }

        function normalizeKey(value, fallback = 'uncategorized') {
            return normalizeValue(value, fallback).toLowerCase();
        }

        function formatDate(value) {
            const date = new Date(value);

            if (Number.isNaN(date.getTime())) {
                return 'Unknown';
            }

            return date.toLocaleString();
        }

        function setStatus(message = '', isError = false) {
            statusMessage.textContent = message;
            statusMessage.className = isError ? 'status error' : 'status';
            statusMessage.style.display = message ? 'block' : 'none';
        }

        function getUniqueValues(values) {
            const uniqueValues = new Map();

            values.forEach((value) => {
                const normalizedValue = normalizeValue(value);
                const normalizedKey = normalizeKey(value);

                if (!uniqueValues.has(normalizedKey)) {
                    uniqueValues.set(normalizedKey, normalizedValue);
                }
            });

            return [...uniqueValues.values()].sort((left, right) => left.localeCompare(right));
        }

        function rebuildSelectOptions(selectElement, values, placeholder, preferredValue = '') {
            selectElement.innerHTML = '';

            const placeholderOption = document.createElement('option');
            placeholderOption.value = '';
            placeholderOption.textContent = placeholder;
            selectElement.appendChild(placeholderOption);

            values.forEach((value) => {
                const option = document.createElement('option');
                option.value = value;
                option.textContent = value;
                selectElement.appendChild(option);
            });

            if (preferredValue) {
                const matchedValue = values.find((value) => normalizeKey(value) === normalizeKey(preferredValue));

                if (matchedValue) {
                    selectElement.value = matchedValue;
                    return;
                }
            }

            selectElement.value = '';
        }

        function getMappedSubjects(course) {
            if (!course) {
                return allMappings.flatMap((mapping) => Array.isArray(mapping.subjects) ? mapping.subjects : []);
            }

            const mapping = allMappings.find((item) => normalizeKey(item.course) === normalizeKey(course));
            return Array.isArray(mapping?.subjects) ? mapping.subjects : [];
        }

        async function parseJson(response) {
            try {
                return await response.json();
            } catch {
                return {};
            }
        }

        function syncCourseOptions() {
            rebuildSelectOptions(
                courseFilter,
                getUniqueValues([
                    ...allMappings.map((mapping) => mapping.course),
                    ...allDocuments.map((document) => document.course)
                ]),
                'All Courses',
                courseFilter.value
            );
        }

        function syncSubjectOptions() {
            const selectedCourse = courseFilter.value;
            const scopedDocuments = selectedCourse
                ? allDocuments.filter((document) => normalizeKey(document.course) === normalizeKey(selectedCourse))
                : allDocuments;

            rebuildSelectOptions(
                subjectFilter,
                getUniqueValues([
                    ...getMappedSubjects(selectedCourse),
                    ...scopedDocuments.map((document) => document.subject)
                ]),
                'All Subjects',
                subjectFilter.value
            );
        }

        function getFilteredDocuments() {
            const searchTerm = searchInput.value.trim().toLowerCase();
            const selectedCourse = normalizeKey(courseFilter.value, '');
            const selectedSubject = normalizeKey(subjectFilter.value, '');
            const selectedAccessType = normalizeKey(accessFilter.value, '');

            return allDocuments.filter((document) => {
                const normalizedCourse = normalizeKey(document.course);
                const normalizedSubject = normalizeKey(document.subject);
                const normalizedAccessType = normalizeKey(document.accessType, 'free');
                const haystack = [
                    document.fileName,
                    document.author,
                    normalizeValue(document.course),
                    normalizeValue(document.subject)
                ].join(' ').toLowerCase();

                if (searchTerm && !haystack.includes(searchTerm)) {
                    return false;
                }

                if (selectedCourse && normalizedCourse !== selectedCourse) {
                    return false;
                }

                if (selectedSubject && normalizedSubject !== selectedSubject) {
                    return false;
                }

                if (selectedAccessType && normalizedAccessType !== selectedAccessType) {
                    return false;
                }

                return true;
            });
        }

        function updateSummary(filteredDocuments) {
            const activeFilters = [
                searchInput.value.trim(),
                courseFilter.value,
                subjectFilter.value,
                accessFilter.value
            ].filter(Boolean).length;

            summaryCount.textContent = `${filteredDocuments.length} ${filteredDocuments.length !== 1 ? pageConfig.itemLabelPlural : pageConfig.itemLabel}`;
            summaryHint.textContent = activeFilters > 0
                ? `${activeFilters} filter${activeFilters !== 1 ? 's' : ''} active`
                : 'Filters update instantly.';
        }

        function createMetaItem(label, value) {
            return `
                <div class="meta-item">
                    <span class="meta-label">${escapeHtml(label)}</span>
                    <div class="meta-value">${escapeHtml(value)}</div>
                </div>
            `;
        }

        function renderDocuments(filteredDocuments) {
            documentsList.innerHTML = '';
            updateSummary(filteredDocuments);

            if (filteredDocuments.length === 0) {
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            filteredDocuments.forEach((doc) => {
                const card = document.createElement('article');
                const normalizedCourse = normalizeValue(doc.course);
                const normalizedSubject = normalizeValue(doc.subject);
                const normalizedAuthor = normalizeValue(doc.author, 'Unknown author');
                const normalizedAccessType = normalizeValue(doc.accessType, 'free').toLowerCase();

                card.className = 'document-card';
                card.innerHTML = `
                    <div class="card-top">
                        <div class="doc-title-wrap">
                            <h2 class="doc-title">${escapeHtml(doc.fileName || 'Untitled document')}</h2>
                            <p class="doc-subtitle">Uploaded ${escapeHtml(formatDate(doc.createdAt))}</p>
                        </div>
                        <span class="badge ${normalizedAccessType}">${escapeHtml(normalizedAccessType)}</span>
                    </div>

                    <div class="meta-grid">
                        ${createMetaItem('Course', normalizedCourse)}
                        ${createMetaItem('Subject', normalizedSubject)}
                        ${createMetaItem('Author', normalizedAuthor)}
                        ${createMetaItem('Views', String(doc.viewCount || 0))}
                        ${createMetaItem('Likes', String(doc.likesCount || 0))}
                    </div>

                    <div class="card-actions">
                        <button type="button" class="delete-btn" data-document-id="${escapeHtml(doc.id)}" data-document-name="${escapeHtml(doc.fileName || 'this document')}">
                            ${escapeHtml(pageConfig.deleteLabel)}
                        </button>
                    </div>
                `;

                const deleteBtn = card.querySelector('.delete-btn');
                deleteBtn.addEventListener('click', () => deleteDocument(doc.id, doc.fileName || 'this document', deleteBtn));
                documentsList.appendChild(card);
            });
        }

        function applyFilters() {
            setStatus('');
            renderDocuments(getFilteredDocuments());
        }

        async function loadDocuments() {
            setStatus('');
            summaryCount.textContent = pageConfig.loadingSummary;
            summaryHint.textContent = pageConfig.loadingHint;
            emptyState.style.display = 'none';
            documentsList.innerHTML = '';

            const [documentsResult, mappingsResult] = await Promise.allSettled([
                fetch(pageConfig.apiUrl),
                fetch(pageConfig.mappingsApiUrl)
            ]);

            let nextMappings = [];
            let mappingsError = '';

            if (mappingsResult.status === 'fulfilled') {
                const mappingsData = await parseJson(mappingsResult.value);

                if (mappingsResult.value.ok) {
                    nextMappings = Array.isArray(mappingsData.mappings) ? mappingsData.mappings : [];
                } else {
                    mappingsError = mappingsData.error || pageConfig.mappingsLoadError;
                }
            } else {
                mappingsError = pageConfig.mappingsLoadError;
            }

            allMappings = nextMappings;

            if (documentsResult.status !== 'fulfilled') {
                allDocuments = [];
                syncCourseOptions();
                syncSubjectOptions();
                updateSummary([]);
                emptyState.style.display = 'none';
                setStatus(pageConfig.loadError, true);
                return;
            }

            const documentsData = await parseJson(documentsResult.value);

            if (!documentsResult.value.ok) {
                allDocuments = [];
                syncCourseOptions();
                syncSubjectOptions();
                updateSummary([]);
                emptyState.style.display = 'none';
                setStatus(documentsData.error || pageConfig.loadError, true);
                return;
            }

            allDocuments = Array.isArray(documentsData.documents) ? documentsData.documents : [];
            syncCourseOptions();
            syncSubjectOptions();
            applyFilters();

            if (mappingsError) {
                setStatus(`${mappingsError}. Course and subject filters may be incomplete.`, true);
            }
        }

        async function deleteDocument(documentId, fileName, button) {
            if (!confirm(`Delete "${fileName}"?`)) {
                return;
            }

            button.disabled = true;
            button.textContent = 'Deleting...';
            setStatus('');

            try {
                const response = await fetch(`${pageConfig.apiUrl}/${encodeURIComponent(documentId)}`, {
                    method: 'DELETE'
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to delete document');
                }

                allDocuments = allDocuments.filter((document) => document.id !== documentId);
                syncCourseOptions();
                syncSubjectOptions();
                applyFilters();

                if (data.storageDeleted === false) {
                    setStatus(pageConfig.deleteStorageError, true);
                }
            } catch (error) {
                button.disabled = false;
                button.textContent = pageConfig.deleteLabel;
                setStatus(error.message || `Failed to delete ${pageConfig.itemLabel}`, true);
            }
        }

        searchInput.addEventListener('input', applyFilters);
        subjectFilter.addEventListener('change', applyFilters);
        accessFilter.addEventListener('change', applyFilters);
        courseFilter.addEventListener('change', () => {
            syncSubjectOptions();
            applyFilters();
        });

        clearFiltersBtn.addEventListener('click', () => {
            searchInput.value = '';
            courseFilter.value = '';
            subjectFilter.value = '';
            accessFilter.value = '';
            syncSubjectOptions();
            applyFilters();
        });

        refreshBtn.addEventListener('click', loadDocuments);

        loadDocuments();
    </script>
</body>

</html>
